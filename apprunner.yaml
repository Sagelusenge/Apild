version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      - cd backend && npm ci

run:
  command: cd backend && npm run db:bootstrap && npm run db:migrate && npm start
  network:
    port: 4000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: API_PREFIX
      value: /api
    - name: DB_PORT
      value: "3306"
    - name: DB_NAME
      value: apild_platform
    - name: DB_CONNECTION_LIMIT
      value: "5"
    - name: DB_SSL
      value: "true"
    - name: DB_SSL_REJECT_UNAUTHORIZED
      value: "true"
    - name: BCRYPT_ROUNDS
      value: "12"
    - name: ALLOW_PUBLIC_REGISTRATION
      value: "false"
    - name: UPLOAD_MAX_SIZE_MB
      value: "10"
    - name: LOG_LEVEL
      value: info
    - name: RATE_LIMIT_WINDOW_MS
      value: "900000"
    - name: RATE_LIMIT_MAX
      value: "300"
    - name: AUTH_RATE_LIMIT_MAX
      value: "20"
    - name: ENABLE_JOBS
      value: "false"
    - name: TRUST_PROXY
      value: "1"
    - name: FILE_STORAGE
      value: s3
    - name: S3_REGION
      value: eu-north-1
  secrets:
    - name: DB_HOST
      value-from: /apild/production/DB_HOST
    - name: DB_USER
      value-from: /apild/production/DB_USER
    - name: DB_PASSWORD
      value-from: /apild/production/DB_PASSWORD
    - name: DB_SSL_CA
      value-from: /apild/production/DB_SSL_CA
    - name: JWT_ACCESS_SECRET
      value-from: /apild/production/JWT_ACCESS_SECRET
    - name: JWT_REFRESH_SECRET
      value-from: /apild/production/JWT_REFRESH_SECRET
    - name: S3_BUCKET
      value-from: /apild/production/S3_BUCKET
