services:
  - type: web
    runtime: static
    name: apild-web-sagel
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_ORIGIN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
