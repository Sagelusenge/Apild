services:
  - type: web
    runtime: node
    name: apild-api-sagel
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run db:bootstrap && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: APP_URL
        fromService:
          type: web
          name: apild-api-sagel
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: apild-web-sagel
          envVarKey: RENDER_EXTERNAL_URL
      - key: DB_HOST
        value: kls00192-ndovyalusengelwasivajustin-c2c9.a.aivencloud.com
      - key: DB_PORT
        value: "22547"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_CONNECTION_LIMIT
        value: "5"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH_TYPE
        value: password
      - key: MAIL_FROM
        value: APILD <no-reply@apild.local>
      - key: UPLOAD_MAX_SIZE_MB
        value: "10"
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: ENABLE_JOBS
        value: "false"
      - key: TRUST_PROXY
        value: "1"

  - type: web
    runtime: static
    name: apild-web-sagel
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: apild-api-sagel
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
