services:
  - type: web
    name: apild-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && npm run db:bootstrap && npm run db:migrate && node scripts/provision-manager.js && npm start
    healthCheckPath: /health/database
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api
      - key: APP_URL
        fromService:
          type: web
          name: apild-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: apild-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUST_PROXY
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "false"
      - key: ENABLE_JOBS
        value: "false"
  - type: web
    name: apild-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: apild-api
          envVarKey: RENDER_EXTERNAL_URL
